<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WA Schedule">
  <meta name="theme-color" content="#0A0F0D">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>WA Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0F0D;
      --surface: #121A16;
      --surface2: #1A2620;
      --border: #1F2F28;
      --primary: #25D366;
      --primary-dark: #1EAA52;
      --primary-dim: rgba(37,211,102,0.10);
      --primary-glow: rgba(37,211,102,0.25);
      --text: #E6F5EE;
      --text2: #7FA890;
      --text3: #3D6050;
      --danger: #FF5252;
      --danger-dim: rgba(255,82,82,0.10);
      --warn: #FFB020;
      --warn-dim: rgba(255,176,32,0.12);
      --r: 14px;
      --rs: 10px;
      --nav: 64px;
      --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; }
    button { font-family: inherit; }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    /* ── SAFE AREA ── */
    .safe-top { height: var(--st); background: var(--bg); flex-shrink: 0; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      flex-shrink: 0;
    }
    .header-left {}
    .app-name { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .app-name em { color: var(--primary); font-style: normal; }
    .app-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .notif-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text2); transition: border-color .2s;
    }
    .notif-btn:hover { border-color: var(--primary); }
    .notif-btn svg { width: 18px; height: 18px; }
    .notif-btn.granted { color: var(--primary); border-color: rgba(37,211,102,.3); }

    /* ── VIEWS ── */
    .views { flex: 1; overflow: hidden; position: relative; }
    .view {
      position: absolute; inset: 0;
      overflow-y: auto; padding: 0 14px;
      opacity: 0; pointer-events: none;
      transition: opacity .18s;
      -webkit-overflow-scrolling: touch;
    }
    .view.active { opacity: 1; pointer-events: all; }

    /* ── BOTTOM NAV ── */
    .nav {
      height: calc(var(--nav) + var(--sb));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      padding-top: 6px;
      padding-bottom: var(--sb);
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 6px;
      transition: color .2s;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-label { font-size: 10px; font-weight: 600; letter-spacing: .3px; }

    /* ── FAB ── */
    .fab {
      position: absolute;
      bottom: calc(var(--nav) + var(--sb) + 14px);
      right: 18px;
      width: 54px; height: 54px;
      background: var(--primary);
      border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px var(--primary-glow);
      transition: transform .18s, box-shadow .18s;
      z-index: 20;
    }
    .fab:active { transform: scale(.93); box-shadow: 0 2px 12px var(--primary-glow); }
    .fab svg { width: 22px; height: 22px; color: #000; }

    /* ── CARDS ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px;
      margin-bottom: 8px; transition: border-color .15s, background .15s;
    }
    .card:active { background: var(--surface2); }

    /* ── CONTACT CARD ── */
    .c-card { display: flex; align-items: center; gap: 11px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--primary-dim); border: 1.5px solid rgba(37,211,102,.2);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: var(--primary);
      flex-shrink: 0; text-transform: uppercase;
    }
    .c-info { flex: 1; min-width: 0; }
    .c-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-phone { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .c-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn.green { background: var(--primary-dim); color: var(--primary); }
    .icon-btn.red { background: var(--danger-dim); color: var(--danger); }
    .icon-btn:active { opacity: .7; }

    /* ── SCHEDULED CARD ── */
    .s-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .s-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary-dim); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px; color: var(--primary);
      flex-shrink: 0; text-transform: uppercase;
    }
    .s-name { font-weight: 600; font-size: 14px; flex: 1; }
    .s-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 20px; letter-spacing: .3px; text-transform: uppercase;
    }
    .s-badge.pending { background: var(--primary-dim); color: var(--primary); }
    .s-badge.notified { background: var(--warn-dim); color: var(--warn); }
    .s-badge.missed { background: var(--danger-dim); color: var(--danger); }
    .s-msg {
      font-size: 13px; color: var(--text2); line-height: 1.45; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .s-foot { display: flex; align-items: center; justify-content: space-between; }
    .s-time { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); }
    .s-time svg { width: 13px; height: 13px; }
    .s-actions { display: flex; gap: 6px; }
    .send-now-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px;
      background: var(--primary-dim); border: 1px solid rgba(37,211,102,.2);
      color: var(--primary); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .send-now-btn:active { background: rgba(37,211,102,.2); }
    .send-now-btn svg { width: 13px; height: 13px; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 12px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
    .search-icon svg { width: 16px; height: 16px; }
    .search-input {
      width: 100%; background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--rs); padding: 11px 14px 11px 38px;
      color: var(--text); font-family: inherit; font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-input::placeholder { color: var(--text3); }

    /* ── SECTION LABEL ── */
    .sec-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 8px; }

    /* ── IMPORT BTN ── */
    .import-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px 16px; margin-bottom: 14px;
      background: var(--primary-dim); border: 1.5px dashed rgba(37,211,102,.35);
      border-radius: var(--rs); color: var(--primary);
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .import-btn:active { background: rgba(37,211,102,.18); }
    .import-btn svg { width: 18px; height: 18px; }

    /* ── EMPTY STATE ── */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 24px; text-align: center; gap: 10px;
    }
    .empty-icon {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
    }
    .empty-icon svg { width: 30px; height: 30px; color: var(--text3); }
    .empty-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }
    .empty-desc { font-size: 13px; color: var(--text2); line-height: 1.5; max-width: 220px; }

    /* ── SCROLL PAD ── */
    .scroll-pad { height: 88px; }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65); backdrop-filter: blur(6px);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity .22s;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sheet {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px 22px 0 0; border-bottom: none;
      padding: 10px 18px calc(18px + var(--sb));
      width: 100%; max-width: 430px;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      max-height: 94vh; overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }
    .handle { width: 34px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .sheet-title { font-family: 'Syne', sans-serif; font-size: 19px; font-weight: 700; margin-bottom: 18px; }

    /* ── FORM ── */
    .fg { margin-bottom: 14px; }
    .fl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text2); margin-bottom: 7px; }
    .fi {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--rs); padding: 12px 13px;
      color: var(--text); font-family: inherit; font-size: 14px; outline: none;
      transition: border-color .2s; -webkit-appearance: none; appearance: none;
    }
    .fi:focus { border-color: var(--primary); }
    .fi::placeholder { color: var(--text3); }
    textarea.fi { resize: none; height: 90px; line-height: 1.5; }
    input[type="datetime-local"].fi { color-scheme: dark; }

    /* ── CONTACT SELECTOR ── */
    .contact-sel {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--rs); padding: 12px 13px;
      color: var(--text); font-family: inherit; font-size: 14px;
      cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;
      transition: border-color .2s;
    }
    .contact-sel:focus { outline: none; border-color: var(--primary); }
    .contact-sel.selected { border-color: rgba(37,211,102,.4); }
    .sel-placeholder { color: var(--text3); }
    .sel-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--primary-dim); display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; flex-shrink: 0;
    }
    .sel-info { flex: 1; }
    .sel-name { font-size: 14px; font-weight: 600; }
    .sel-phone { font-size: 11px; color: var(--text2); }

    /* ── CONTACT PICKER LIST ── */
    .cpicker {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--rs); margin-top: 6px;
      max-height: 190px; overflow-y: auto; display: none;
    }
    .cpicker.open { display: block; }
    .cpicker-search { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .cpicker-search input {
      width: 100%; background: transparent; border: none; color: var(--text);
      font-family: inherit; font-size: 13px; outline: none;
    }
    .cpicker-search input::placeholder { color: var(--text3); }
    .cpicker-item {
      padding: 10px 13px; cursor: pointer; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); transition: background .12s;
    }
    .cpicker-item:last-child { border-bottom: none; }
    .cpicker-item:active { background: var(--surface); }
    .pi-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--primary-dim); display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--primary); flex-shrink: 0;
    }
    .pi-name { font-size: 13px; font-weight: 500; }
    .pi-phone { font-size: 11px; color: var(--text2); }
    .cpicker-empty { padding: 20px; text-align: center; font-size: 13px; color: var(--text3); }

    /* ── MANUAL PHONE INPUT ── */
    .or-divider {
      display: flex; align-items: center; gap: 10px; margin: 10px 0;
      font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── BUTTONS ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 13px 18px; border-radius: var(--rs);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity .15s, transform .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-secondary { background: var(--surface2); border: 1.5px solid var(--border); color: var(--text); }
    .btn-full { width: 100%; }
    .btn svg { width: 17px; height: 17px; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-row .btn { flex: 1; }

    /* ── NOTIF BANNER ── */
    .nb {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1.5px solid rgba(37,211,102,.2);
      border-radius: var(--rs); padding: 12px 13px; margin-bottom: 12px;
    }
    .nb svg { width: 18px; height: 18px; color: var(--primary); flex-shrink: 0; }
    .nb-text { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.4; }
    .nb-btn {
      font-size: 12px; font-weight: 700; color: var(--primary);
      background: none; border: none; cursor: pointer; white-space: nowrap; padding: 4px 6px;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: calc(var(--nav) + var(--sb) + 14px); left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 100px; padding: 9px 18px;
      font-size: 13px; font-weight: 500; white-space: nowrap;
      z-index: 300; opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── INFO BOX ── */
    .info-box {
      background: var(--primary-dim); border: 1px solid rgba(37,211,102,.15);
      border-radius: var(--rs); padding: 10px 13px; margin-bottom: 14px;
      font-size: 12px; color: var(--text2); line-height: 1.5;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .info-box svg { width: 15px; height: 15px; color: var(--primary); flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body>
<div id="app">
  <div class="safe-top"></div>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="app-name">WA <em>Schedule</em></div>
      <div class="app-sub" id="hdr-sub">Your scheduled messages</div>
    </div>
    <button class="notif-btn" id="notif-btn" onclick="handleNotifBtn()" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </div>

  <!-- Views -->
  <div class="views">
    <!-- SCHEDULED VIEW -->
    <div class="view active" id="view-scheduled"></div>
    <!-- CONTACTS VIEW -->
    <div class="view" id="view-contacts"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="nav">
    <button class="nav-btn active" data-view="scheduled" onclick="switchView('scheduled')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="nav-label">Scheduled</span>
    </button>
    <button class="nav-btn" data-view="contacts" onclick="switchView('contacts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="nav-label">Contacts</span>
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" onclick="openScheduleModal()" title="New scheduled message">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</div>

<!-- SCHEDULE MODAL -->
<div class="overlay" id="sched-overlay" onclick="overlayClick(event,'sched-overlay')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sheet-title">New Scheduled Message</div>

    <div class="fg">
      <label class="fl">Contact</label>
      <button class="contact-sel" id="contact-sel-btn" onclick="toggleCPicker()">
        <span class="sel-placeholder">Select a contact…</span>
      </button>
      <div class="cpicker" id="cpicker">
        <div class="cpicker-search">
          <input type="text" id="cpicker-search" placeholder="Search contacts…" oninput="renderCPicker()" autocomplete="off">
        </div>
        <div id="cpicker-list"></div>
      </div>
      <div class="or-divider">or enter number directly</div>
      <input class="fi" type="tel" id="manual-phone" placeholder="+1 555 123 4567" autocomplete="tel">
    </div>

    <div class="fg">
      <label class="fl">Message</label>
      <textarea class="fi" id="sched-msg" placeholder="Type your message…"></textarea>
    </div>

    <div class="fg">
      <label class="fl">When to remind you</label>
      <input class="fi" type="datetime-local" id="sched-dt">
    </div>

    <div class="info-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      At the scheduled time you'll get a notification. Tap it to open WhatsApp with the message pre-filled — then just hit Send.
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('sched-overlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSchedule()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Schedule
      </button>
    </div>
  </div>
</div>

<!-- ADD CONTACT MODAL -->
<div class="overlay" id="contact-overlay" onclick="overlayClick(event,'contact-overlay')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sheet-title" id="contact-modal-title">Add Contact</div>

    <div class="fg">
      <label class="fl">Name</label>
      <input class="fi" type="text" id="c-name" placeholder="Full name" autocomplete="name">
    </div>
    <div class="fg">
      <label class="fl">Phone (with country code)</label>
      <input class="fi" type="tel" id="c-phone" placeholder="+1 555 123 4567" autocomplete="tel">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('contact-overlay')">Cancel</button>
      <button class="btn btn-primary" onclick="saveContact()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Save
      </button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  STATE & STORAGE
// ═══════════════════════════════════════════════════════
let contacts = [];
let scheduled = [];
let editContactId = null;
let schedContact = null; // selected contact in schedule form

function loadData() {
  contacts = JSON.parse(localStorage.getItem('wa_contacts') || '[]');
  scheduled = JSON.parse(localStorage.getItem('wa_scheduled') || '[]');
}
function saveContacts() { localStorage.setItem('wa_contacts', JSON.stringify(contacts)); }
function saveScheduled() { localStorage.setItem('wa_scheduled', JSON.stringify(scheduled)); }

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function cleanPhone(p) { return (p||'').replace(/\D/g,''); }
function waUrl(phone, msg) { return `https://wa.me/${cleanPhone(phone)}?text=${encodeURIComponent(msg)}`; }

function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const tom = new Date(now); tom.setDate(tom.getDate()+1);
  const t = d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if (d.toDateString()===now.toDateString()) return `Today at ${t}`;
  if (d.toDateString()===tom.toDateString()) return `Tomorrow at ${t}`;
  return d.toLocaleDateString([],{month:'short',day:'numeric'})+` at ${t}`;
}

function defaultDT() {
  const d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T09:00`;
}

function showToast(msg, ms=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), ms);
}

// ═══════════════════════════════════════════════════════
//  VIEW SWITCHING
// ═══════════════════════════════════════════════════════
let currentView = 'scheduled';

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`view-${v}`).classList.add('active');
  document.querySelector(`[data-view="${v}"]`).classList.add('active');
  document.getElementById('hdr-sub').textContent = v==='scheduled'
    ? 'Your scheduled messages' : 'Your WhatsApp contacts';
  if (v==='scheduled') renderScheduled();
  else renderContacts();
}

function renderAll() { renderScheduled(); renderContacts(); updateNotifBtn(); }

// ═══════════════════════════════════════════════════════
//  RENDER: SCHEDULED
// ═══════════════════════════════════════════════════════
function renderScheduled() {
  const el = document.getElementById('view-scheduled');
  let html = '';

  // Notification banner if needed
  if (Notification.permission === 'default') {
    html += `<div class="nb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="nb-text">Enable notifications to get reminders at the scheduled time</span>
      <button class="nb-btn" onclick="requestNotifPermission()">Enable</button>
    </div>`;
  }

  const pending = scheduled.filter(s=>s.status==='pending');
  const notified = scheduled.filter(s=>s.status==='notified');
  const missed = scheduled.filter(s=>s.status==='missed');

  if (scheduled.length === 0) {
    html += `<div class="empty">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div class="empty-title">No messages yet</div>
      <div class="empty-desc">Tap the <strong style="color:var(--primary)">+</strong> button to schedule your first WhatsApp message</div>
    </div>`;
  } else {
    if (pending.length) {
      html += `<div class="sec-label">Upcoming (${pending.length})</div>`;
      html += pending.map(s=>schedCard(s)).join('');
    }
    if (notified.length) {
      html += `<div class="sec-label" style="margin-top:14px">Ready to send (${notified.length})</div>`;
      html += notified.map(s=>schedCard(s)).join('');
    }
    if (missed.length) {
      html += `<div class="sec-label" style="margin-top:14px">Missed (${missed.length})</div>`;
      html += missed.map(s=>schedCard(s)).join('');
    }
  }

  html += '<div class="scroll-pad"></div>';
  el.innerHTML = html;
}

function schedCard(s) {
  const badge = s.status==='pending' ? 'pending' : s.status==='notified' ? 'notified' : 'missed';
  const badgeLabel = s.status==='pending' ? 'Pending' : s.status==='notified' ? 'Ready' : 'Missed';
  return `<div class="card">
    <div class="s-head">
      <div class="s-avatar">${initials(s.contactName)}</div>
      <div class="s-name">${esc(s.contactName)}</div>
      <span class="s-badge ${badge}">${badgeLabel}</span>
    </div>
    <div class="s-msg">${esc(s.message)}</div>
    <div class="s-foot">
      <div class="s-time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ${fmtTime(s.time)}
      </div>
      <div class="s-actions">
        <button class="send-now-btn" onclick="sendNow('${s.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.42 2 2 0 0 1 3.62 1.25h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.83a16 16 0 0 0 6 6l.86-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.5 16.92z"/></svg>
          Open WA
        </button>
        <button class="icon-btn red" onclick="deleteScheduled('${s.id}')" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: CONTACTS
// ═══════════════════════════════════════════════════════
let contactSearch = '';

function renderContacts() {
  const el = document.getElementById('view-contacts');
  const q = contactSearch.toLowerCase();
  const filtered = contacts.filter(c =>
    c.name.toLowerCase().includes(q) || c.phone.includes(q)
  );

  let html = `<div class="search-wrap">
    <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input class="search-input" type="text" placeholder="Search contacts…" value="${esc(contactSearch)}" oninput="onContactSearch(this.value)" autocomplete="off">
  </div>`;

  // Import from phone button (only if API available)
  if ('contacts' in navigator && 'ContactsManager' in window) {
    html += `<button class="import-btn" onclick="importFromPhone()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="12" y1="3" x2="12" y2="7" style="display:none"/></svg>
      Import from Phone Contacts
    </button>`;
  }

  html += `<button class="import-btn" style="border-style:solid;background:var(--surface)" onclick="openAddContact()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Contact Manually
  </button>`;

  if (filtered.length === 0 && contacts.length === 0) {
    html += `<div class="empty">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="empty-title">No contacts yet</div>
      <div class="empty-desc">Add contacts manually or import from your phone</div>
    </div>`;
  } else if (filtered.length === 0) {
    html += `<div class="empty" style="padding:40px 24px">
      <div class="empty-desc">No contacts match "${esc(contactSearch)}"</div>
    </div>`;
  } else {
    html += `<div class="sec-label">${filtered.length} contact${filtered.length!==1?'s':''}</div>`;
    // Sort alphabetically
    [...filtered].sort((a,b)=>a.name.localeCompare(b.name)).forEach(c => {
      html += `<div class="card">
        <div class="c-card">
          <div class="avatar">${initials(c.name)}</div>
          <div class="c-info">
            <div class="c-name">${esc(c.name)}</div>
            <div class="c-phone">+${cleanPhone(c.phone)}</div>
          </div>
          <div class="c-actions">
            <button class="icon-btn green" onclick="quickMessage('${c.id}')" title="Send message now">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
            <button class="icon-btn green" onclick="scheduleFor('${c.id}')" title="Schedule message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>
            <button class="icon-btn" style="background:var(--surface2);color:var(--text2)" onclick="editContact('${c.id}')" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="icon-btn red" onclick="deleteContact('${c.id}')" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </div>
      </div>`;
    });
  }

  html += '<div class="scroll-pad"></div>';
  el.innerHTML = html;
}

function onContactSearch(v) { contactSearch = v; renderContacts(); }

// ═══════════════════════════════════════════════════════
//  CONTACT ACTIONS
// ═══════════════════════════════════════════════════════
function openAddContact(name='', phone='') {
  editContactId = null;
  document.getElementById('contact-modal-title').textContent = 'Add Contact';
  document.getElementById('c-name').value = name;
  document.getElementById('c-phone').value = phone;
  openModal('contact-overlay');
  setTimeout(()=>document.getElementById('c-name').focus(), 320);
}

function editContact(id) {
  const c = contacts.find(x=>x.id===id); if(!c) return;
  editContactId = id;
  document.getElementById('contact-modal-title').textContent = 'Edit Contact';
  document.getElementById('c-name').value = c.name;
  document.getElementById('c-phone').value = c.phone;
  openModal('contact-overlay');
}

function saveContact() {
  const name = document.getElementById('c-name').value.trim();
  const phone = document.getElementById('c-phone').value.trim();
  if (!name) { showToast('Please enter a name'); return; }
  if (!cleanPhone(phone)) { showToast('Please enter a phone number'); return; }

  if (editContactId) {
    const idx = contacts.findIndex(c=>c.id===editContactId);
    if (idx>=0) { contacts[idx].name=name; contacts[idx].phone=phone; }
    showToast('Contact updated ✓');
  } else {
    contacts.push({ id:uid(), name, phone });
    showToast('Contact saved ✓');
  }
  saveContacts();
  closeModal('contact-overlay');
  renderContacts();
}

function deleteContact(id) {
  if (!confirm('Delete this contact?')) return;
  contacts = contacts.filter(c=>c.id!==id);
  saveContacts(); renderContacts(); showToast('Contact deleted');
}

function quickMessage(id) {
  const c = contacts.find(x=>x.id===id); if(!c) return;
  const msg = prompt(`Message to ${c.name}:`); if(!msg) return;
  window.open(waUrl(c.phone, msg), '_blank');
}

function scheduleFor(id) {
  const c = contacts.find(x=>x.id===id); if(!c) return;
  openScheduleModal(c);
}

async function importFromPhone() {
  if (!('contacts' in navigator)) { showToast('Not supported on this browser'); return; }
  try {
    const picked = await navigator.contacts.select(['name','tel'], { multiple:true });
    let added = 0;
    picked.forEach(p => {
      const name = (p.name||[])[0] || 'Unknown';
      const phone = (p.tel||[])[0] || '';
      if (cleanPhone(phone) && !contacts.find(c=>cleanPhone(c.phone)===cleanPhone(phone))) {
        contacts.push({ id:uid(), name, phone });
        added++;
      }
    });
    if (added) { saveContacts(); renderContacts(); showToast(`${added} contact${added>1?'s':''} imported ✓`); }
    else showToast('No new contacts added');
  } catch(e) { showToast('Import cancelled'); }
}

// ═══════════════════════════════════════════════════════
//  SCHEDULE MODAL
// ═══════════════════════════════════════════════════════
function openScheduleModal(preContact=null) {
  schedContact = preContact;
  document.getElementById('sched-msg').value = '';
  document.getElementById('sched-dt').value = defaultDT();
  document.getElementById('manual-phone').value = '';
  renderContactSelBtn();
  closeCPicker();
  openModal('sched-overlay');
}

function renderContactSelBtn() {
  const btn = document.getElementById('contact-sel-btn');
  if (schedContact) {
    btn.className = 'contact-sel selected';
    btn.innerHTML = `<div class="sel-avatar">${initials(schedContact.name)}</div>
      <div class="sel-info"><div class="sel-name">${esc(schedContact.name)}</div>
      <div class="sel-phone">+${cleanPhone(schedContact.phone)}</div></div>`;
  } else {
    btn.className = 'contact-sel';
    btn.innerHTML = `<span class="sel-placeholder">Select a contact…</span>`;
  }
}

function toggleCPicker() {
  const cp = document.getElementById('cpicker');
  if (cp.classList.contains('open')) closeCPicker();
  else {
    cp.classList.add('open');
    document.getElementById('cpicker-search').value = '';
    renderCPicker();
    setTimeout(()=>document.getElementById('cpicker-search').focus(), 100);
  }
}

function closeCPicker() {
  document.getElementById('cpicker').classList.remove('open');
}

function renderCPicker() {
  const q = document.getElementById('cpicker-search').value.toLowerCase();
  const list = document.getElementById('cpicker-list');
  const filtered = contacts.filter(c =>
    c.name.toLowerCase().includes(q) || c.phone.includes(q)
  );
  if (filtered.length === 0) {
    list.innerHTML = `<div class="cpicker-empty">No contacts found</div>`;
    return;
  }
  list.innerHTML = [...filtered].sort((a,b)=>a.name.localeCompare(b.name)).map(c =>
    `<div class="cpicker-item" onclick="selectContact('${c.id}')">
      <div class="pi-av">${initials(c.name)}</div>
      <div><div class="pi-name">${esc(c.name)}</div><div class="pi-phone">+${cleanPhone(c.phone)}</div></div>
    </div>`
  ).join('');
}

function selectContact(id) {
  schedContact = contacts.find(c=>c.id===id) || null;
  renderContactSelBtn();
  closeCPicker();
}

function saveSchedule() {
  const msg = document.getElementById('sched-msg').value.trim();
  const dtVal = document.getElementById('sched-dt').value;
  const manualPhone = document.getElementById('manual-phone').value.trim();

  // Determine phone + name
  let phone='', name='';
  if (schedContact) {
    phone = schedContact.phone; name = schedContact.name;
  } else if (manualPhone) {
    phone = manualPhone; name = `+${cleanPhone(manualPhone)}`;
  } else {
    showToast('Please select a contact or enter a number'); return;
  }

  if (!msg) { showToast('Please enter a message'); return; }
  if (!dtVal) { showToast('Please pick a date and time'); return; }

  const ts = new Date(dtVal).getTime();
  if (isNaN(ts) || ts <= Date.now()) { showToast('Please pick a future date/time'); return; }

  const item = {
    id: uid(),
    contactName: name,
    phone,
    message: msg,
    time: ts,
    waUrl: waUrl(phone, msg),
    status: 'pending',
    created: Date.now()
  };

  scheduled.push(item);
  saveScheduled();
  sendToSW(item);
  closeModal('sched-overlay');
  switchView('scheduled');
  showToast(`⏰ Scheduled for ${fmtTime(ts)}`);
}

function deleteScheduled(id) {
  cancelInSW(id);
  scheduled = scheduled.filter(s=>s.id!==id);
  saveScheduled(); renderScheduled(); showToast('Removed');
}

function sendNow(id) {
  const s = scheduled.find(x=>x.id===id); if(!s) return;
  window.open(s.waUrl, '_blank');
  s.status = 'notified';
  saveScheduled(); renderScheduled();
}

// ═══════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function updateNotifBtn() {
  const btn = document.getElementById('notif-btn');
  if (Notification.permission==='granted') btn.classList.add('granted');
  else btn.classList.remove('granted');
}

async function handleNotifBtn() {
  if (Notification.permission==='granted') {
    showToast('🔔 Notifications are enabled');
  } else {
    await requestNotifPermission();
  }
}

async function requestNotifPermission() {
  if (!('Notification' in window)) { showToast('Notifications not supported'); return; }
  const r = await Notification.requestPermission();
  updateNotifBtn();
  if (r==='granted') {
    showToast('🔔 Notifications enabled!');
    renderScheduled();
    resendAllToSW();
  } else {
    showToast('Notifications blocked in browser settings');
  }
}

function checkDue() {
  const now = Date.now(); let changed = false;
  scheduled.forEach(s => {
    if (s.status==='pending' && s.time <= now) {
      if (Notification.permission==='granted') {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(`💬 ${s.contactName}`, {
            body: s.message.length>90 ? s.message.slice(0,90)+'…' : s.message,
            icon: '/icon.svg', badge: '/icon.svg',
            tag: s.id, data: { waUrl: s.waUrl, id: s.id },
            requireInteraction: true
          });
        }).catch(()=>{});
      }
      s.status = 'notified'; changed = true;
    }
  });
  if (changed) { saveScheduled(); if(currentView==='scheduled') renderScheduled(); }
}

// ═══════════════════════════════════════════════════════
//  SERVICE WORKER
// ═══════════════════════════════════════════════════════
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('/sw.js');
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data.type==='FIRED') {
        const s = scheduled.find(x=>x.id===e.data.id);
        if (s && s.status==='pending') { s.status='notified'; saveScheduled(); if(currentView==='scheduled') renderScheduled(); }
      }
      if (e.data.type==='OPEN_WA') window.open(e.data.waUrl, '_blank');
    });
    resendAllToSW();
  } catch(e) { console.log('SW registration failed:', e); }
}

async function sendToSW(item) {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    reg.active?.postMessage({ type:'SCHEDULE', data:item });
  } catch(e){}
}

async function cancelInSW(id) {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    reg.active?.postMessage({ type:'CANCEL', data:{id} });
  } catch(e){}
}

async function resendAllToSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const pending = scheduled.filter(s=>s.status==='pending' && s.time>Date.now());
    reg.active?.postMessage({ type:'RESCHEDULE_ALL', data:{ items:pending } });
  } catch(e){}
}

// ═══════════════════════════════════════════════════════
//  MODAL HELPERS
// ═══════════════════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClick(e, id) { if(e.target===document.getElementById(id)) closeModal(id); }

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  loadData();
  await registerSW();
  checkDue();
  renderAll();
  setInterval(checkDue, 30000);

  // Add some sample data if completely empty
  if (contacts.length === 0 && scheduled.length === 0) {
    contacts.push(
      { id: uid(), name: 'Mom', phone: '15551234567' },
      { id: uid(), name: 'Work Team', phone: '15559876543' }
    );
    saveContacts();
  }
});

// Re-check when page becomes visible again (phone unlocked)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    checkDue();
    resendAllToSW();
  }
});
</script>
